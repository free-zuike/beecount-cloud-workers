name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: npm install

      - name: Setup D1 database
        id: d1
        run: |
          DB_ID=""

          # 用 JSON 格式查找现有数据库，避免 grep 解析问题
          DB_ID=$(npx wrangler d1 list --json 2>/dev/null | node -e "
            const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const db = data.find(d => d.name === 'beecount-cloud');
            if (db) process.stdout.write(db.uuid);
          " || true)

          if [ -z "$DB_ID" ]; then
            echo "No existing database found, creating new one..."
            npx wrangler d1 create beecount-cloud 2>&1 | tee create_out.txt || true
            DB_ID=$(grep -oP '[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}' create_out.txt 2>/dev/null || true)
          fi

          if [ -z "$DB_ID" ]; then
            echo "FATAL: Could not resolve database_id"
            exit 1
          fi

          echo "database_id=$DB_ID" >> $GITHUB_OUTPUT
          echo "Resolved D1 database_id: $DB_ID"

      - name: Resolve account ID
        id: account
        run: |
          echo "Resolving Cloudflare account_id from API token..."
          ACCOUNT_ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts?per_page=100" \
            | node -e "
              const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              if (!d.success || !d.result || d.result.length === 0) {
                console.error('Failed to resolve account_id:', JSON.stringify(d.errors || {}));
                process.exit(1);
              }
              process.stdout.write(d.result[0].id);
            ")
          if [ -z "$ACCOUNT_ID" ]; then
            echo "FATAL: Could not resolve account_id"
            exit 1
          fi
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "Resolved account_id: $ACCOUNT_ID"

      - name: Auto-create R2 bucket (if R2 enabled on account)
        id: r2
        run: |
          ACCOUNT_ID="${{ steps.account.outputs.account_id }}"
          echo "Checking if R2 is available on account..."
          R2_CHECK=$(curl -s -w "%{http_code}" -o /tmp/r2_check.json \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/r2/buckets")
          HTTP_CODE=$(echo "$R2_CHECK" | tail -1)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "R2 is enabled on this account, creating bucket..."
            CREATE_RESULT=$(curl -s -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/r2/buckets" \
              -d '{"name":"beecount-storage"}')
            if echo "$CREATE_RESULT" | grep -q '"success":true'; then
              echo "R2 bucket beecount-storage created/already exists"
              echo "r2_enabled=true" >> $GITHUB_OUTPUT
            elif echo "$CREATE_RESULT" | grep -q 'already exists'; then
              echo "R2 bucket already exists"
              echo "r2_enabled=true" >> $GITHUB_OUTPUT
            else
              echo "Failed to create R2 bucket: $CREATE_RESULT"
              echo "r2_enabled=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "R2 not enabled on this account (HTTP $HTTP_CODE), skipping bucket creation"
            echo "r2_enabled=false" >> $GITHUB_OUTPUT
          fi

      - name: Patch wrangler.toml
        run: |
          DB_ID="${{ steps.d1.outputs.database_id }}"
          ACCOUNT_ID="${{ steps.account.outputs.account_id }}"
          echo "Patching database_id to: $DB_ID"
          echo "Patching account_id to: $ACCOUNT_ID"
          sed -i "s|database_id = \"[^\"]*\"|database_id = \"$DB_ID\"|" wrangler.toml
          sed -i "s|CLOUDFLARE_ACCOUNT_ID = \"[^\"]*\"|CLOUDFLARE_ACCOUNT_ID = \"$ACCOUNT_ID\"|" wrangler.toml
          # 注入 API token（从 GitHub Secrets 读，不提交到 git）
          sed -i "s|CLOUDFLARE_API_TOKEN = \"ci-injected-at-deploy-time\"|CLOUDFLARE_API_TOKEN = \"${{ secrets.CLOUDFLARE_API_TOKEN }}\"|" wrangler.toml
          grep "database_id\|CLOUDFLARE_API_TOKEN\|CLOUDFLARE_ACCOUNT_ID" wrangler.toml

      - name: Bind R2 bucket to Worker (if R2 enabled)
        if: steps.r2.outputs.r2_enabled == 'true'
        run: |
          ACCOUNT_ID="${{ steps.account.outputs.account_id }}"
          # 通过 API 绑定 R2 bucket 到 Worker，不修改 wrangler.toml
          BIND_RESULT=$(curl -s -X PATCH \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/beecount-cloud-workers/settings" \
            -d '{"r2_bucket_bindings":[{"name":"R2","bucket_name":"beecount-storage"}]}')
          if echo "$BIND_RESULT" | grep -q '"success":true'; then
            echo "R2 bucket bound to Worker successfully"
          else
            echo "Failed to bind R2: $BIND_RESULT"
          fi

      - name: Build frontend
        run: cd frontend && pnpm install --no-frozen-lockfile && pnpm build

      - name: Inject version into sw.js
        run: |
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" src/version.ts)
          sed -i "s/beecount-web-v2/beecount-web-v2-$VERSION/" frontend/apps/web/dist/sw.js
          echo "Injected version $VERSION into sw.js"

      - name: Rename index.html to app.html
        run: mv frontend/apps/web/dist/index.html frontend/apps/web/dist/app.html

      - name: Deploy
        run: npx wrangler deploy
