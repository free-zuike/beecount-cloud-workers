name: D1 Diagnostic (temporary)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Recurring rule revisions (426/null check)
        run: |
          npx wrangler d1 execute beecount-cloud --remote --json \
            --command "SELECT id, status, revision, next_due_at, substr(created_at,1,25) AS ca, substr(updated_at,1,25) AS ua FROM mcp_state_records WHERE kind='recurring_rule'" \
            2>/dev/null | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log('RULES:',JSON.stringify(d[0].results))"

      - name: Recent backup runs
        run: |
          npx wrangler d1 execute beecount-cloud --remote --json \
            --command "SELECT id, schedule_id, status, started_at, finished_at FROM backup_runs ORDER BY id DESC LIMIT 6" \
            2>/dev/null | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log('RUNS:',JSON.stringify(d[0].results))"

      - name: Backup schedules
        run: |
          npx wrangler d1 execute beecount-cloud --remote --json \
            --command "SELECT id, user_id, name, enabled, last_run_status, cron_effective_at FROM backup_schedules" \
            2>/dev/null | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log('SCHEDULES:',JSON.stringify(d[0].results))"

      - name: Notification reads
        run: |
          npx wrangler d1 execute beecount-cloud --remote --json \
            --command "SELECT COUNT(*) AS cnt FROM user_notification_reads" \
            2>/dev/null | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log('READS:',JSON.stringify(d[0].results))"

      - name: Device app versions (426 risk)
        run: |
          npx wrangler d1 execute beecount-cloud --remote --json \
            --command "SELECT platform, app_version, COUNT(*) AS cnt FROM devices GROUP BY platform, app_version ORDER BY cnt DESC" \
            2>/dev/null | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log('DEVICES:',JSON.stringify(d[0].results))"

      - name: Sync failures state
        run: |
          npx wrangler d1 execute beecount-cloud --remote --json \
            --command "SELECT device_id, direction, failure_count, reason FROM device_sync_failures" \
            2>/dev/null | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log('SYNCFAIL:',JSON.stringify(d[0].results))"
