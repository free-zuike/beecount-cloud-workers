name: D1 Diagnostic (temporary)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Resolve account id
        id: account
        run: |
          ACCOUNT_ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts?per_page=100" \
            | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));process.stdout.write(d.result[0].id)")
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT

      - name: Inspect tables
        run: |
          npx wrangler d1 execute beecount-cloud --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name" \
            2>/dev/null | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log('TABLES:', d[0].results.map(r=>r.name).join(', '))"

      - name: Inspect recurring tables schema
        run: |
          npx wrangler d1 execute beecount-cloud --remote --json \
            --command "SELECT name, sql FROM sqlite_master WHERE name IN ('mcp_state_records','mcp_source_references','ws_relay_frames','sync_operation_receipts')" \
            2>/dev/null | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));for(const r of d[0].results)console.log('---',r.name,'---\n',r.sql)"

      - name: Recurring rules data
        run: |
          npx wrangler d1 execute beecount-cloud --remote --json \
            --command "SELECT id, ledger_id, status, revision, substr(data_json,1,120) AS head, next_due_at, updated_at FROM mcp_state_records WHERE kind='recurring_rule'" \
            2>/dev/null | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(JSON.stringify(d[0].results,null,1))"

      - name: Device app versions (426 risk check)
        run: |
          npx wrangler d1 execute beecount-cloud --remote --json \
            --command "SELECT platform, app_version, COUNT(*) AS cnt FROM devices GROUP BY platform, app_version ORDER BY cnt DESC" \
            2>/dev/null | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(JSON.stringify(d[0].results))"

      - name: Schema version marker
        run: |
          npx wrangler d1 execute beecount-cloud --remote --json \
            --command "SELECT * FROM app_metadata" \
            2>/dev/null | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(JSON.stringify(d[0].results))"
