name: MCP parity

# 运行时差分：把上游 Python 实现（TNT-Likely/BeeCount-Cloud）的输出作为 golden，
# 与本地实现逐字段比对。
#
# ref 策略：默认**每次跑都对齐上游最新 tag**（因为上游按版本发 tag）；
# 需要复现某次结果时，手动设 PARITY_UPSTREAM_REF 固定到某个 tag/SHA。
#
# 无需任何必填配置即可运行。可选：
#   Variables  PARITY_UPSTREAM_REPO  覆盖上游仓库（默认 TNT-Likely/BeeCount-Cloud）
#   Variables  PARITY_UPSTREAM_REF   固定 ref（默认空 = 取最新 tag）
#   Secrets    PARITY_UPSTREAM_TOKEN 上游为私有仓库时的只读 token

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/mcp/**'
      - 'src/routes/**'
      - 'src/services/import_data/**'
      - 'tests/mcp-differential.test.ts'
      - 'tests/rest-differential.test.ts'
      - 'tests/import-differential.test.ts'
      - 'tests/mcp-harness.ts'
      - 'tests/parity-compare.ts'
      - 'scripts/parity/**'
      - '.github/workflows/parity.yml'

concurrency:
  group: mcp-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Resolve upstream ref
        id: upstream
        run: |
          REPO="${{ vars.PARITY_UPSTREAM_REPO || 'TNT-Likely/BeeCount-Cloud' }}"
          if [ -n "${{ vars.PARITY_UPSTREAM_REF }}" ]; then
            REF="${{ vars.PARITY_UPSTREAM_REF }}"
            echo "::notice::使用固定 ref: $REPO@$REF"
          else
            REF=$(git ls-remote --tags --refs --sort=-v:refname "https://github.com/$REPO.git" \
                  | head -1 | sed 's#.*refs/tags/##')
            if [ -z "$REF" ]; then
              echo "::error::无法取得上游 tag 列表（仓库不存在或无权限）"
              exit 1
            fi
            echo "::notice::对齐上游最新 tag: $REPO@$REF"
          fi
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout worker
        uses: actions/checkout@v7

      - name: Checkout upstream (Python)
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.upstream.outputs.repo }}
          ref: ${{ steps.upstream.outputs.ref }}
          path: .parity/upstream
          token: ${{ secrets.PARITY_UPSTREAM_TOKEN || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/parity/requirements.txt

      - name: Install upstream deps
        run: pip install -r scripts/parity/requirements.txt

      # 先单独验证 import：缺依赖/路径错时在这里失败，报错比在 dump 里清楚
      - name: Preflight imports
        working-directory: .parity/upstream
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:////tmp/parity.db
        run: |
          python -c "import src.database, src.mcp.tools.read_tools; print('read imports ok')"
          python -c "import src.routers.read.summary, src.routers.read.ledgers, src.routers.read.rates, src.routers.read.attachment_gallery; print('rest imports ok')"
          python -c "import src.services.import_data.parser; print('import parser ok')"

      - name: Generate golden from upstream
        working-directory: .parity/upstream
        env:
          SCHEDULER_TIMEZONE: Asia/Shanghai
          DATABASE_URL: sqlite:////tmp/parity.db
          PYTHONPATH: .
        run: |
          rm -f /tmp/parity.db
          python "$GITHUB_WORKSPACE/scripts/parity/upstream_dump.py" \
                 "$GITHUB_WORKSPACE/tests/fixtures/upstream-golden.json"

      - name: Upload golden
        uses: actions/upload-artifact@v4
        with:
          name: upstream-golden-${{ steps.upstream.outputs.ref }}
          path: tests/fixtures/upstream-*.json
          retention-days: 7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install deps
        run: npm ci

      - name: Run MCP differential test
        run: npm test -- --run tests/mcp-differential.test.ts

      - name: Run REST differential test
        run: npm test -- --run tests/rest-differential.test.ts

      - name: Run import differential test
        run: npm test -- --run tests/import-differential.test.ts

      - name: Job summary
        if: always()
        run: |
          {
            echo "### MCP parity"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 上游 | \`${{ steps.upstream.outputs.repo }}\` |"
            echo "| 对齐 ref | \`${{ steps.upstream.outputs.ref }}\` |"
            echo "| 本地用例 | \`tests/mcp-differential.test.ts\` \`tests/rest-differential.test.ts\` \`tests/import-differential.test.ts\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # golden 变化说明上游行为变了：开 PR 让人确认，而不是自动覆盖。
      # 先判断是否真的变了 —— 没变化时不做任何 git 写操作
      # （原先用 peter-evans/create-pull-request，即使无变化也在 CI 里报 error 400）
      - name: Detect golden drift
        id: drift
        run: |
          if git diff --quiet -- tests/fixtures/upstream-golden.json tests/fixtures/upstream-rest-golden.json tests/fixtures/upstream-import-golden.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::golden 与上游一致，无漂移"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- tests/fixtures/upstream-golden.json tests/fixtures/upstream-rest-golden.json tests/fixtures/upstream-import-golden.json
          fi

      - name: Push golden drift branch
        if: steps.drift.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B parity/upstream-golden
          git add tests/fixtures/upstream-golden.json tests/fixtures/upstream-rest-golden.json tests/fixtures/upstream-import-golden.json
          git commit -m "chore(parity): 上游 MCP 输出变化（${{ steps.upstream.outputs.ref }}）"
          git push --force origin parity/upstream-golden

      - name: Open PR on upstream drift
        if: steps.drift.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --base main --head parity/upstream-golden \
            --title "chore(parity): 上游 MCP 输出变化（${{ steps.upstream.outputs.ref }}）" \
            --body "上游 \`${{ steps.upstream.outputs.repo }}\` 的 \`${{ steps.upstream.outputs.ref }}\` 输出发生变化，golden 已重新生成。差异路径见本次运行的 \`Run MCP/REST/import differential test\` 日志。请确认是上游有意的行为调整再合并；若本地实现走偏，应改本地代码而不是接受新 Golden。" \
            || echo "::notice::PR 已存在或无变化"
