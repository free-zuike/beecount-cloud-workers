name: Sync from upstream

# 让 Fork 用户一键同步上游仓库的最新代码
# 用法：在你 Fork 后的仓库 → Actions → Sync from upstream → Run workflow
# 也支持每周自动检查上游更新

on:
  schedule:
    # 每周日凌晨 3 点自动检查（避免整点拥堵）
    - cron: '0 3 * * 0'
  workflow_dispatch:
    # 手动触发：Actions → Sync from upstream → Run workflow

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync from upstream
        run: |
          # 添加上游仓库
          git remote add upstream https://github.com/free-zuike/beecount-cloud-workers.git || true
          git fetch upstream

          # 获取当前分支
          CURRENT_BRANCH=$(git branch --show-current)
          echo "Current branch: $CURRENT_BRANCH"

          # 尝试合并上游 main 分支
          git merge upstream/main --no-edit

          # 推送到 Fork
          git push origin "$CURRENT_BRANCH"

          echo "✅ Fork synced with upstream"

      - name: Create PR if merge conflicts
        if: failure()
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Sync from upstream"
          body: |
            自动同步上游仓库 [free-zuike/beecount-cloud-workers](https://github.com/free-zuike/beecount-cloud-workers) 的最新更新。

            如果合并冲突无法自动解决，会创建 PR 供手动处理。
          branch: sync-upstream
          base: ${{ github.ref_name }}
