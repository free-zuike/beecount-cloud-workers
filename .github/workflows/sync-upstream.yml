name: Sync from upstream

# 让 Fork 用户一键同步上游仓库的最新代码
# 用法：在你 Fork 后的仓库 → Actions → Sync from upstream → Run workflow
# 也支持每天自动检查上游更新（注意：GitHub 默认禁用 fork 里的定时任务，
# 需要 fork 主人在 Actions 设置中手动启用 scheduled workflows 才会自动跑）
#
# 同步策略：纯跟随 fork（无本地独有提交）直接对齐上游，历史与上游完全一致、
# 可快进；只有 fork 本地存在独有提交时才走 merge 合并（保留双方历史，不丢工作）。

on:
  schedule:
    # 每天凌晨 3 点自动检查（避免整点拥堵）
    - cron: '0 3 * * *'
  workflow_dispatch:
    # 手动触发：Actions → Sync from upstream → Run workflow

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare upstream sync
        id: sync
        run: |
          git remote add upstream https://github.com/free-zuike/beecount-cloud-workers.git || true
          git fetch upstream main
          CURRENT_BRANCH=$(git branch --show-current)
          echo "branch=$CURRENT_BRANCH" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor HEAD upstream/main 2>/dev/null; then
            echo "No local commits — preparing fast-forward state"
            git reset --hard upstream/main
            echo "mode=fast-forward" >> "$GITHUB_OUTPUT"
          else
            echo "Local commits detected — merging upstream in the Actions workspace"
            git merge upstream/main --no-edit
            echo "mode=merge" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.1

      - name: Install Worker dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Validate merged Worker
        run: |
          npm test -- --run
          npx tsc --noEmit --pretty false --project tsconfig.json
          npm run check:schema

      - name: Validate merged frontend
        run: |
          cd frontend
          pnpm test
          pnpm build
          test -s apps/web/dist/index.html
          test -s apps/web/dist/sw.js

      - name: Push validated sync
        run: |
          BRANCH="${{ steps.sync.outputs.branch }}"
          if [ "${{ steps.sync.outputs.mode }}" = "fast-forward" ]; then
            git push --force-with-lease origin "$BRANCH"
          else
            git push origin "$BRANCH"
          fi
          echo "Fork synced with upstream after quality gates passed"

      - name: Create PR if merge conflicts
        if: failure()
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Sync from upstream"
          body: |
            自动同步上游仓库 [free-zuike/beecount-cloud-workers](https://github.com/free-zuike/beecount-cloud-workers) 的最新更新。

            如果合并冲突无法自动解决，会创建 PR 供手动处理。
          branch: sync-upstream
          base: ${{ github.ref_name }}
