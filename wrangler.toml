name = "beecount-cloud-workers"
main = "src/index.ts"
compatibility_date = "2026-06-18"
compatibility_flags = ["nodejs_compat"]

[define]
__dirname = '""'
__filename = '""'

# 定时任务触发器 - 每5分钟检查一次
[triggers]
crons = ["*/5 * * * *"]

[alias]
tslib = "tslib"
"@modelcontextprotocol/sdk/server/index.js" = "./node_modules/@modelcontextprotocol/sdk/dist/esm/server/index.js"
"@modelcontextprotocol/sdk/types.js" = "./node_modules/@modelcontextprotocol/sdk/dist/esm/types.js"
"@modelcontextprotocol/sdk/server/webStandardStreamableHttp.js" = "./node_modules/@modelcontextprotocol/sdk/dist/esm/server/webStandardStreamableHttp.js"
"@modelcontextprotocol/sdk" = "./node_modules/@modelcontextprotocol/sdk/dist/esm/index.js"
"zod/v4" = "./node_modules/zod/v4/index.js"
"ssh2/lib/protocol/crypto/poly1305.js" = "./shims/ssh2-poly1305.js"
"age-encryption" = "./node_modules/age-encryption/dist/index.js"

[[d1_databases]]
binding = "DB"
database_name = "beecount-cloud"
  database_id = "393b596d-31c5-436a-828c-7baab2b113b2"

[[durable_objects.bindings]]
name = "BEECOUNT_DO"
class_name = "BeeCountDO"

[[r2_buckets]]
binding = "R2"
bucket_name = "beecount-storage"

[[workflows]]
name = "backup-workflow"
binding = "BACKUP_WORKFLOW"
class_name = "BackupWorkflow"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["BeeCountDO"]

[vars]
API_PREFIX = "/api/v1"
# D1 Export API 所需：账户 ID 和数据库 ID（对应 [[d1_databases]] 中的 database_id）
CLOUDFLARE_ACCOUNT_ID = "3f762871bd2e6a373f70d3b3a8e5dc88"
D1_DATABASE_ID = "393b596d-31c5-436a-828c-7baab2b113b2"
# CLOUDFLARE_API_TOKEN 在 CI 部署时通过 sed 动态注入（不提交到 git）
CLOUDFLARE_API_TOKEN = "ci-injected-at-deploy-time"
# JWT_SECRET 通过 Cloudflare Dashboard → Workers → Settings → Variables and Secrets 设置
# 或 CLI: npx wrangler secret put JWT_SECRET

[observability]
enabled = true

# ssh2 的 .node 原生插件在 try/catch 中加载，wrangler 将其视为数据文件
[[rules]]
type = "Data"
globs = ["**/*.node"]
fallthrough = true

# 自动构建前端 (CI/CD 中使用)
# [build]
# command = "cd frontend && VITE_APP_VERSION=1.6.2 pnpm install --no-frozen-lockfile && VITE_APP_VERSION=1.6.2 pnpm build"

# 静态资产配置 - 官方前端构建输出在 apps/web/dist
[assets]
directory = "./frontend/apps/web/dist"
binding = "ASSETS"
